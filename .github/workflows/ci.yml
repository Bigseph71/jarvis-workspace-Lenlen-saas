name: CI

# Qualitäts-Pipeline: läuft bei jedem Pull Request und bei jedem Push auf main.
# Das SaaS-Projekt liegt im Unterordner saas-pflege/ (Monorepo im Workspace-Repo),
# daher laufen alle Schritte mit working-directory: saas-pflege.
on:
  push:
    branches: [main]
    paths: ["saas-pflege/**", ".github/workflows/ci.yml"]
  pull_request:
    branches: [main]
    paths: ["saas-pflege/**", ".github/workflows/ci.yml"]

# Ältere Läufe desselben Branches abbrechen, wenn ein neuer Commit kommt.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: saas-pflege

jobs:
  verify:
    name: lint → typecheck → test → build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Wegwerf-Postgres für die Integrationstests. Bewusst ein Service-Container
    # und keine gemeinsam genutzte Datenbank: jeder Lauf startet leer, parallele
    # Läufe kommen sich nicht ins Gehege, und es ist kein Zugangsdatum nötig.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lenlen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # localhost: die Garde in test/helpers/test-database.ts lässt genau das zu.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lenlen_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: saas-pflege/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma-Client generieren: die getypten Modelle werden von typecheck
      # und build der DB-Konsumenten (Backend) benötigt.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Schema (prisma db push) + RLS-Policies auf die Wegwerf-Datenbank. Ohne
      # die Policies liefe der Tenant-Isolationstest gegen eine Datenbank, in
      # der es gar nichts zu isolieren gibt.
      - name: Provision test database
        run: pnpm --filter @len-len/database provision:test

      - name: Test
        env:
          RUN_DB_TESTS: "1"
        run: pnpm test

      - name: Build
        env:
          # Pflicht im Produktions-Build (siehe apps/web/next.config.mjs): ohne
          # sie bräche der Build ab. Hier ein Platzhalter – die CI prüft, dass
          # kompiliert werden KANN, sie erzeugt kein Deployment-Artefakt. Der
          # echte Wert wird beim Deployen gesetzt und ist dort unverzichtbar,
          # weil Next ihn fest ins Bundle schreibt.
          NEXT_PUBLIC_API_URL: https://ci.invalid
        run: pnpm build
